spring.application.name=ShopManagementApp

# IF ON RAILWAY: Uses your cloud PostgreSQL database.
# IF RUNNING LOCALLY: Safely boots using an invisible, in-memory H2 database.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:localshopdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=sa
spring.datasource.password=

# Automated Agile Model Sync
spring.jpa.hibernate.ddl-auto=update

# Disable Thymeleaf cache for immediate page refresh visibility
spring.thymeleaf.cache=false
