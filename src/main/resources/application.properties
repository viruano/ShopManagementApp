spring.application.name=ShopManagementApp

# NATIVE AUTOMATIC ENGINES: Spring Boot reads these exact keys automatically
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Auto-generate schema rows
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=create

spring.jpa.open-in-view=true
spring.thymeleaf.cache=false

# THE DIALECT ANCHOR: Forces PostgreSQL translation parameters live in the cloud
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# ⚙️ SYSTEM WORKSPACE GLOBAL ENVIRONMENT PARAMETERS
# =========================================================
# Set this flag to 'true' to quickly activate the Demo Garage profile layout
shop.config.demo-mode=false

# --- ENVIRONMENT SELECTION A: REAL PRODUCTION BRAND DETAILS ---
shop.config.live.name=XYZ Auto Services LLC
shop.config.live.address=27 Hicks Av, Annapolis, MD 21401
shop.config.live.phone=(443) 325-6663
shop.config.live.tax-rate=0.060

# --- ENVIRONMENT SELECTION B: PLAYGROUND DEMO SHOP DETAILS ---s
shop.config.demo.name=Main Street Demo Garage
shop.config.demo.address=999 Test Drive Ave, Sandbox City, CA 90210
shop.config.demo.phone=(800) 555-0100
shop.config.demo.tax-rate=0.0825
