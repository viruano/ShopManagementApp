# ===================================================================
# 🚀 Application Core Metadata Identifiers
# ===================================================================
spring.application.name=ShopManagementApp

# ===================================================================
# 🗄️ Relational Database Connection Configurations
# ===================================================================
# When running on Railway, it automatically picks up the three SPRING_DATASOURCE variables.
# If they are completely missing (like on your laptop), it falls back to this local H2 file.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/localshopdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===================================================================
# 🏗️ Hibernate & Object-Relational Mapping (JPA) Rules
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# ===================================================================
# 🖥️ Interactive Web & Template View Layout Settings
# ===================================================================
spring.thymeleaf.cache=${THYMELEAF_CACHE_ENABLED:false}
