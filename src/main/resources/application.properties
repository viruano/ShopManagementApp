spring.application.name=ShopManagementApp

# Standard configuration endpoints that gracefully toggle between local H2 files and your cloud parameters
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/localshopdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.thymeleaf.cache=${THYMELEAF_CACHE_ENABLED:false}