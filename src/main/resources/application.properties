spring.application.name=ShopManagementApp

# =========================================================
# 🛡️ GLOBAL SAFE ENVIRONMENT CONFIGURATION
# =========================================================
# Keeps 'localdev' profile active for internal tracing variables
spring.profiles.active=localdev

# Core Thymeleaf UI settings
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false

# =========================================================
# 💻 NATIVE Windows Local PostgreSQL DATABASE CHANNEL
# =========================================================
# 👑 FORCE LOCAL POSTGRES: Removed prefixes so Spring is forced to use your computer's engine!
spring.datasource.url=jdbc:postgresql://localhost:5432/shopdb_local
spring.datasource.username=postgres
# 🔧 TASK: Change this to your literal pgAdmin master password!
spring.datasource.password=admin2026!
spring.datasource.driver-class-name=org.postgresql.Driver

# 🔒 THE DATA MODEL ANCHOR: Set to 'update' so your data seeder can hydarate tables on boot!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disables multiple tenants online lookup while debugging on localhost
shop.config.multi-tenant=true

# =========================================================
# ☁️ ENVIRONMENT PROFILE B: RAILWAY CLOUD PRODUCTION ENGINE
# =========================================================
%prod.spring.datasource.url=${SPRING_DATASOURCE_URL}
%prod.spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
%prod.spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
%prod.spring.jpa.hibernate.ddl-auto=create
%prod.spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
%prod.shop.config.multi-tenant=true

# =========================================================
# ⚙️ SYSTEM WORKSPACE GLOBAL ENVIRONMENT PARAMETERS
# =========================================================
shop.config.live.name=XYZ Auto Services LLC
shop.config.live.address=27 Hicks Av, Annapolis, MD 21401
shop.config.live.phone=(443) 325-6663
shop.config.live.tax-rate=0.060

