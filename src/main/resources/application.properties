# ===================================================================
# 🚀 Application Core Metadata Identifiers
# ===================================================================
spring.application.name=ShopManagementApp

# ===================================================================
# 🗄️ Relational Database Connection Configurations
# ===================================================================
# Smart Switch: Connects to live PostgreSQL on Railway, or falls back to local file on your hard drive
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/localshopdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# ===================================================================
# 🏗️ Hibernate & Object-Relational Mapping (JPA) Rules
# ===================================================================
# Automatically builds or updates missing tables on startup without dropping data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Smart Dialect Switch: Applies H2 rules locally, but switches to PostgreSQL live in the cloud
spring.jpa.properties.hibernate.dialect=${DATABASE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ===================================================================
# 🖥️ Interactive Web & Template View Layout Settings
# ===================================================================
spring.thymeleaf.cache=${THYMELEAF_CACHE_ENABLED:false}
