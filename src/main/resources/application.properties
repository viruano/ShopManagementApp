# ===================================================================
# 🚀 Application Core Metadata Identifiers
# ===================================================================
spring.application.name=ShopManagementApp

# ===================================================================
# 🗄️ Relational Database Connection Configurations
# ===================================================================
# SELF-HEALING SWITCH: Reads a custom live cloud URL string, or falls back seamlessly to your local laptop file!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/localshopdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# ===================================================================
# 🏗️ Hibernate & Object-Relational Mapping (JPA) Rules
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=${DATABASE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ===================================================================
# 🖥️ Interactive Web & Template View Layout Settings
# ===================================================================
spring.thymeleaf.cache=${THYMELEAF_CACHE_ENABLED:false}
